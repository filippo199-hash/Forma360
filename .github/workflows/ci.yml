name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  verify:
    name: Verify (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    # The Vitest step runs the full pglite-backed suite (~12 min on a shared
    # runner: db/permissions/api boot pglite and apply the whole migration
    # history per suite, single-fork). With the webpack build after it the job
    # needs ~18-20 min end to end — the old 15-min cap cancelled it mid-build
    # once the suite actually started running (it used to fail fast at
    # format:check and never reach the tests).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      - name: Test (ESLint rules)
        run: pnpm test:eslint-rules

      - name: Dependency advisory gate
        # A ratchet, not a blanket `pnpm audit`: fails only on a high/critical
        # advisory that is NOT in .github/audit-baseline.json, each entry of
        # which carries a written reason. A gate that always fails gets
        # deleted, and this tree legitimately carries advisories that are not
        # applicable (better-auth's OAuth issues on an OTP-only deployment) or
        # have no upstream fix (xlsx). See scripts/audit-gate.mjs.
        run: pnpm audit:gate

      - name: Prepare build env
        # `next build` collects page data by importing every route module, which
        # forces the strict server-env parse. Next loads `.env` files into
        # process.env for that eval, but shell `env:` vars are NOT visible to it
        # — so the fake values must go in a .env file, not a step env block. No
        # real service is contacted (Anthropic/R2 clients are built lazily inside
        # handlers). Railway builds with the real vars; this file is CI-only and
        # gitignored. SKIP_ENV_VALIDATION is a belt-and-braces bypass.
        run: |
          cat > apps/web/.env <<'ENVEOF'
          SKIP_ENV_VALIDATION=1
          APP_URL=http://localhost:3000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ci
          REDIS_URL=redis://localhost:6379
          BETTER_AUTH_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          BETTER_AUTH_URL=http://localhost:3000
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET=ci
          R2_PUBLIC_URL=https://r2.example.com
          RESEND_API_KEY=ci
          RESEND_FROM=noreply@example.com
          EMAIL_DELIVERY=resend
          RENDER_SHARED_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          ANTHROPIC_API_KEY=ci-fake-anthropic-key
          ENVEOF

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

  e2e:
    name: E2E (Playwright, ${{ matrix.brand }})
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    # One leg per brand: the app is BUILT per brand (ADR 0010), so a
    # single default-brand run leaves every FreeHS-only surface — the
    # /try sandbox, permits, incidents, RAMS, fire safety — untested at
    # the e2e layer. The FreeHS journey specs (e2e/freehs-*.spec.ts)
    # self-skip on the forma360 leg via the fixture's brand probe.
    strategy:
      fail-fast: false
      matrix:
        brand: [forma360, freehs]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forma360
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @forma360/web exec playwright install --with-deps chromium

      - name: Apply DB migrations
        run: pnpm --filter @forma360/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forma360

      - name: Prepare env
        # Both `next build` (page-data eval) and `next start` (Playwright boot)
        # load apps/web/.env; shell `env:` vars don't reach next build's eval.
        # DB/Redis point at this job's service containers; the rest are fake.
        run: |
          cat > apps/web/.env <<'ENVEOF'
          BRAND=${{ matrix.brand }}
          NEXT_PUBLIC_BRAND=${{ matrix.brand }}
          SKIP_ENV_VALIDATION=1
          APP_URL=http://localhost:3000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/forma360
          REDIS_URL=redis://localhost:6379
          BETTER_AUTH_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          BETTER_AUTH_URL=http://localhost:3000
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET=ci
          R2_PUBLIC_URL=https://r2.example.com
          RESEND_API_KEY=ci
          RESEND_FROM=noreply@example.com
          EMAIL_DELIVERY=resend
          RENDER_SHARED_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          ANTHROPIC_API_KEY=ci-fake-anthropic-key
          ENVEOF

      - name: Build web app
        run: pnpm --filter @forma360/web build
        env:
          NODE_ENV: production

      - name: Run Playwright
        # Env comes from apps/web/.env (written above), which `next start` loads.
        # Note: EMAIL_DELIVERY=console is refused under NODE_ENV=production, so
        # the .env uses resend (no mail is actually sent during the smoke).
        run: pnpm --filter @forma360/web test:e2e
        env:
          NODE_ENV: production
          # Brand-aware specs (training, the FreeHS journeys) read this at
          # Playwright runtime — apps/web/.env is only loaded by `next`.
          NEXT_PUBLIC_BRAND: ${{ matrix.brand }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.brand }}
          path: apps/web/playwright-report
          retention-days: 7

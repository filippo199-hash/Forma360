# Nixpacks config for the Railway `worker` service.
#
# NOT READ AS DEPLOYED. Nixpacks reads nixpacks.toml from the build context
# root, and the worker's Root Directory is `/` — so the ROOT nixpacks.toml is
# the file that drives the setup phase. This one only takes effect if the
# service's Root Directory is ever pointed at `packages/jobs`.
#
# The nightly backup's `pg_dump` therefore does NOT get its binary from here,
# despite the postgresql_16 below. Trusting this file is exactly what left the
# job throwing `spawn pg_dump ENOENT` every night (Sentry FREEHS-4); the real
# declaration lives in the root nixpacks.toml. See docs/deployment.md.

[phases.setup]
nixPkgs = ['nodejs_22', 'pnpm-9_x', 'postgresql_16']

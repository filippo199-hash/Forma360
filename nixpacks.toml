# Root Nixpacks config.
#
# Railway services that build from the repo root (Root Directory = `/`)
# read this file. We force Node 22 + pnpm 9 so a fresh-clone monorepo
# install never falls back to npm (which chokes on `workspace:^`).
#
# Service-specific overrides live in `apps/<svc>/nixpacks.toml` but are
# only picked up when the service's Root Directory points at that folder.
# For pnpm workspaces that path is broken — npm install tries to resolve
# `workspace:^` and fails — so we set Root Directory to `/` and let this
# file drive the setup phase instead. See docs/deployment.md.

[phases.setup]
# chromium: needed by the PDF renderer (puppeteer-core uses it as a headless
# browser). @sparticuz/chromium is compiled for AWS Lambda (Amazon Linux 2) and
# doesn't run on nixpkgs-based Railway containers; we fall back to the
# system-installed chromium instead (see packages/render/src/pdf.ts).
# ffmpeg: samples still frames from inbound WhatsApp videos so the AI
# assistant's vision can "watch" them (apps/web/src/server/video-frames.ts).
# postgresql_16: `pg_dump` for the worker's nightly backup job. It has to be
# declared HERE, not in packages/jobs/nixpacks.toml — the worker's Root
# Directory is `/`, so that file is never read and the job spent its life
# throwing `spawn pg_dump ENOENT` (Sentry FREEHS-4). Matches the pinned
# postgres-ssl:16 server; pg_dump refuses a server newer than itself.
nixPkgs = ['nodejs_22', 'pnpm-9_x', 'chromium', 'ffmpeg', 'postgresql_16']
